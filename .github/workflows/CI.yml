name: CI

# Upstream H2's Java build (Maven via ./build.sh, JDK 11/17) — ~10 minutes.
# The book toolchain lives in books/ and is covered by book.yml, so this workflow
# only runs when the Java sources it actually builds change, or on demand.
on:
  push:
    paths: ['h2/**', '.github/workflows/CI.yml']
  pull_request:
    paths: ['h2/**', '.github/workflows/CI.yml']
  workflow_dispatch:

permissions:
  contents: read #  to fetch code (actions/checkout)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java-version: [11, 17]
    name: Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java-version }}
        distribution: temurin
    - name: Test
      run: |
        cd h2
        echo $JAVA_OPTS
        export JAVA_OPTS=-Xmx512m
        ./build.sh jar testCI
