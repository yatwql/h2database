name: Book

# Gate tiers (mirrored by scripts/check.sh so local and CI agree):
#   fast   — every push / PR: lint, unit suite, structural + contract gates
#   full   — master and tags: every gate (adds prose/content/metrics gates)
#   release — tags: full + build artifacts uploaded for the release

on:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['books/**', '.github/workflows/book.yml']
  pull_request:
    branches: [master]
    paths: ['books/**', '.github/workflows/book.yml']

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: books/requirements-dev.txt
      - run: python -m pip install -r books/requirements-dev.txt
      - name: ruff
        run: ruff check books/src/python books/src/test
      - name: architecture, contract and schema gates
        run: |
          steps=architecture,script_contract,style_schema,llm_policy
          steps="$steps,versions,file_length"
          python books/src/python/make.py check --only "$steps"

  fast:
    name: Fast tier (unit suite)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: books/requirements-dev.txt
      - run: python -m pip install -r books/requirements-dev.txt
      - name: unit suite
        run: python books/src/python/make.py test --timings

  gates:
    name: Full gate set
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: books/requirements-dev.txt
      - run: python -m pip install -r books/requirements-dev.txt
      - name: every gate
        run: python books/src/python/make.py check --keep-going --timings

  slow:
    name: Slow tier (browser + pandoc)
    runs-on: ubuntu-latest
    needs: fast
    if: github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: books/requirements-dev.txt
      - run: python -m pip install -r books/requirements-dev.txt
      - name: install chromium and pandoc
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y pandoc
      - name: full suite
        run: BOOK_SLOW=1 python books/src/python/make.py test --full --timings
      - name: coverage with the browser and pandoc paths present
        # the ratchet only means something when pypdf/playwright/pandoc are
        # installed, otherwise the render paths are skipped and coverage dips
        run: python books/src/python/make.py cover

  deliver:
    name: Build artifacts (release)
    runs-on: ubuntu-latest
    needs: [gates, slow]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: books/requirements-dev.txt
      - run: python -m pip install -r books/requirements-dev.txt
      - name: install chromium and pandoc
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y pandoc
      - name: build book and artifacts
        run: python books/src/python/make.py deliver --timings
      - uses: actions/upload-artifact@v4
        with:
          name: book-${{ github.ref_name }}
          path: |
            books/dist/*.md
            books/dist/*.html
            books/dist/*.pdf
            books/dist/*.epub
          retention-days: 30
