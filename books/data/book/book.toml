# Single source of truth for the H2 source-code-analysis book.
# Every tool under tools/ resolves paths, chapter order and quality
# thresholds from this file — do not hard-code them in scripts.

[book]
title = "H2 数据库引擎源码剖析"
version = "6.6"
merged_name = "h2-source-code-analysis"

[project]
# Display copy used by the renderers (HTML title, EPUB metadata, PDF running head).
display_title_en = "H2 Database Engine Source Code Analysis"
display_title_zh = "H2 数据库引擎源码剖析"
author = "其·龙（Stallman Wang）"
email = "stallman.wang@foxmail.com"
publisher = "H2 数据库引擎源码剖析项目"
description = "深入剖析 H2 Database v2.x 核心源码"
running_head = "H2 数据库引擎源码剖析"
breadcrumb_root = "H2 源码剖析"

[paths]
cover_image = ""       # optional: books/data/assets/cover.png
# All paths are relative to the books/ root (the parent of data/).
manuscript = "data/manuscript"
dist = "dist"
docs = "docs"
tmp = "data/tmp"
state = "data/state"
templates = "data/templates"
book = "data/book"
library = ".."        # 其他书所在的目录（缺省＝本目录的父级）
baselines = "data/baselines"

[chapters]
# Reading order. cover.md is front matter for the merged document.
files = [
    "cover.md",
    "ch1-2-architecture.md",
    "ch3-packages.md",
    "ch4-5-modules-processes.md",
    "ch6-1-data-structures.md",
    "ch6-2-storage-algorithms.md",
    "ch6-3-query-algorithms.md",
    "ch7-sql-execution.md",
    "ch8-query-optimizer.md",
    "ch9-10-persistence-locking.md",
    "ch11-12-guide-summary.md",
    "appendix-a-case-studies.md",
    "appendix-b-version-changes.md",
]
front_glob = "front/*.md"
back_glob = "back/*.md"


[sections]
# Headings every chapter body must contain (H2 level).
per_chapter = ["本章导读", "本章小结", "延伸思考", "延展阅读"]


[chapters.packages]
# Single-owner mapping: every source package is described by exactly one chapter.
# Non-owner chapters reference the owner instead of re-describing it (see
# books/docs/managements/technical.md).
"ch1-2-architecture.md" = ["org.h2", "org.h2.engine"]
"ch3-packages.md" = ["org.h2.api", "org.h2.schema"]
"ch4-5-modules-processes.md" = ["org.h2.command"]
"ch6-1-data-structures.md" = ["org.h2.value", "org.h2.result"]
"ch6-2-storage-algorithms.md" = ["org.h2.mvstore"]
"ch6-3-query-algorithms.md" = ["org.h2.index"]
"ch7-sql-execution.md" = ["org.h2.expression", "org.h2.expression.function", "org.h2.command.dml", "org.h2.command.ddl"]
"ch8-query-optimizer.md" = ["org.h2.table", "org.h2.expression.analysis"]
"ch9-10-persistence-locking.md" = ["org.h2.store", "org.h2.store.fs", "org.h2.util"]
"ch11-12-guide-summary.md" = ["org.h2.tools", "org.h2.jdbc"]

[chapters.titles]
"ch1-2-architecture.md" = ["H2 总体架构", "分层模块划分"]
"ch3-packages.md" = ["包结构与模块职责"]
"ch4-5-modules-processes.md" = ["模块边界与依赖治理", "进程内数据流"]
"ch6-1-data-structures.md" = ["数据结构：值、行与页"]
"ch6-2-storage-algorithms.md" = ["存储与压缩算法"]
"ch6-3-query-algorithms.md" = ["索引与表达式求值"]
"ch7-sql-execution.md" = ["SQL 解析与执行"]
"ch8-query-optimizer.md" = ["查询优化器"]
"ch9-10-persistence-locking.md" = ["持久化", "并发控制"]
"ch11-12-guide-summary.md" = ["二次开发指南", "全书总结"]
"appendix-a-case-studies.md" = ["源码坐标索引"]
"appendix-b-version-changes.md" = ["版本变更对照"]

[chapters.numbering]
# H1 numbering: each file owns unique chapter numbers (no duplicates).
"ch1-2-architecture.md" = [1, 2]
"ch3-packages.md" = [3]
"ch4-5-modules-processes.md" = [4, 5]
"ch6-1-data-structures.md" = [6]
"ch6-2-storage-algorithms.md" = [7]
"ch6-3-query-algorithms.md" = [8]
"ch7-sql-execution.md" = [9]
"ch8-query-optimizer.md" = [10]
"ch9-10-persistence-locking.md" = [11, 12]
"ch11-12-guide-summary.md" = [13, 14]
"appendix-a-case-studies.md" = [15]
"appendix-b-version-changes.md" = [16]

[chapters.coverage]
# Which book chapters a file covers (a file may cover several; duplicates allowed).
"ch1-2-architecture.md" = [1, 2]
"ch3-packages.md" = [3]
"ch4-5-modules-processes.md" = [4, 5]
"ch6-1-data-structures.md" = [6]
"ch6-2-storage-algorithms.md" = [6]
"ch6-3-query-algorithms.md" = [6]
"ch7-sql-execution.md" = [7]
"ch8-query-optimizer.md" = [8]
"ch9-10-persistence-locking.md" = [9, 10]
"ch11-12-guide-summary.md" = [11, 12]

[llm]
# 源码 → 手稿时是否让 LLM 起草导读/小结（事实、坐标、表格始终确定性）
ingest_prose = false

[sources]
src_main = "../h2/src/main"
pom_root = "../h2/pom.xml"
version = "2.5.259-SNAPSHOT"

# ---- 编辑风格档（原 data/book/editing.toml）----------------------------------
# 三档预设写在 lib/_editorial.py；这里只写本书的选择与逐项覆盖。
# 编辑风格档：这本书选择哪一档「优秀技术书要素」，以及逐项覆盖。
# 三档预设（manual / tutorial / hands-on）写在 lib/_editorial.py；这里只写差异。
# 判据是 audit/editorial.py：必选元素低于下限、或任一计数低于基线即失败。
#
# 当前状态：本书按 tutorial 档登记，但学习目标、要点回顾、常见误区三项尚未补齐，
# 缺口记录在 data/baselines/editorial.json；补内容按 docs/plan/editorial-profile/ 推进。

[editing.profile]
name = "tutorial"

[editing.elements.key_points]
# 各章小结已条目化（每章 3–14 条），下限按 tutorial 档的 4 条判。
enabled = true

[editing.elements.learning_goals]
# 本书的学习目标写在章首引用的「章节要点」块里（`> - …`），不是独立小节。
heading = "章节要点"
enabled = true

[editing.elements.pitfalls]
enabled = false

[editing.elements.table_density]
enabled = false

# ---- LLM 起草契约（原 data/book/llm-tasks.toml）------------------------------
# 每次调用（无论采用与否）落 data/state/llm-ledger.jsonl；判据在 lib/_llm_contract.py。
# LLM 起草契约：每个任务允许写多长、允不允许出现事实之外的数字。
# 判据在 lib/_llm_contract.py；每次调用（无论采用与否）落 data/state/llm-ledger.jsonl。
# 未写本文件时用工具链默认值（20–220 字、单段、禁止事实外数字），书可按任务覆盖。

[llm_tasks.default]
min_chars = 20
max_chars = 220
single_paragraph = true
allow_unknown_digits = false

[llm_tasks.tasks.lead]
# 本章导读：一到两句，覆盖包数与行数，这两个数字由调用方作为事实传入。
max_chars = 200

[llm_tasks.tasks.summary]
# 小节小结：同上，允许略长一句。
max_chars = 220
