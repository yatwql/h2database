# Single source of truth for the H2 source-code-analysis book.
# Every tool under tools/ resolves paths, chapter order and quality
# thresholds from this file — do not hard-code them in scripts.

[book]
title = "H2 数据库引擎源码剖析"
version = "6.5"
merged_name = "h2-source-code-analysis"

[paths]
# All paths are relative to the directory containing this file.
manuscript = "data/manuscript"
dist = "dist"
docs = "docs"
tools = "src/python"

[chapters]
# Reading order. cover.md is front matter for the merged document.
files = [
    "cover.md",
    "ch1-2-architecture.md",
    "ch3-packages.md",
    "ch4-5-modules-processes.md",
    "ch6-1-data-structures.md",
    "ch6-2-storage-algorithms.md",
    "ch6-3-query-algorithms.md",
    "ch7-sql-execution.md",
    "ch8-query-optimizer.md",
    "ch9-10-persistence-locking.md",
    "ch11-12-guide-summary.md",
    "appendix-a-case-studies.md",
    "appendix-b-version-changes.md",
]
front_glob = "front/*.md"
back_glob = "back/*.md"


[sections]
# Headings every chapter body must contain (H2 level).
per_chapter = ["本章导读", "本章小结", "延伸思考", "延展阅读"]


[chapters.packages]
# Which source packages each chapter digests. Stage 1 uses this to generate the
# outline and the coverage matrix; keep the keys in sync with `files` above.
"ch1-2-architecture.md" = ["org.h2", "org.h2.engine", "org.h2.jdbc", "org.h2.api"]
"ch3-packages.md" = ["org.h2.api", "org.h2.command", "org.h2.engine", "org.h2.expression", "org.h2.index", "org.h2.mvstore", "org.h2.result", "org.h2.schema", "org.h2.store", "org.h2.table", "org.h2.tools", "org.h2.util", "org.h2.value"]
"ch4-5-modules-processes.md" = ["org.h2.engine", "org.h2.command", "org.h2.store", "org.h2.mvstore"]
"ch6-1-data-structures.md" = ["org.h2.result", "org.h2.value", "org.h2.mvstore", "org.h2.util"]
"ch6-2-storage-algorithms.md" = ["org.h2.mvstore", "org.h2.store", "org.h2.store.fs"]
"ch6-3-query-algorithms.md" = ["org.h2.index", "org.h2.expression", "org.h2.result"]
"ch7-sql-execution.md" = ["org.h2.command", "org.h2.command.dml", "org.h2.command.ddl", "org.h2.expression", "org.h2.expression.function"]
"ch8-query-optimizer.md" = ["org.h2.index", "org.h2.table", "org.h2.expression.analysis"]
"ch9-10-persistence-locking.md" = ["org.h2.store", "org.h2.mvstore", "org.h2.engine", "org.h2.util"]
"appendix-a-case-studies.md" = ["org.h2.engine", "org.h2.command", "org.h2.mvstore", "org.h2.index", "org.h2.expression"]
"appendix-b-version-changes.md" = ["org.h2.api", "org.h2.engine", "org.h2.mvstore", "org.h2.tools"]
"ch11-12-guide-summary.md" = ["org.h2.tools", "org.h2.api", "org.h2.util"]
