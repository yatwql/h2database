[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookwright"
version = "0.1.0"
description = "Source-code analysis into a book: the toolchain behind books/."
# No console scripts yet: an installed entry point would import the action layer,
# which reads the configuration at import time. Those reads (lib/_log.py,
# check_runner.py, make.py) must become call-time first — see
# docs/plan/multi-book/plan.md step four.
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src/python" }

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["lib*", "audit*", "ingest*", "render*", "manuscript*", "core*", "app*"]

[tool.setuptools.package-data]
"lib" = ["*.json"]
